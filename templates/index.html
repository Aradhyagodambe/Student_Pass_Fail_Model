<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Success Predictor</title>
    <!-- Import a clean, modern font -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #4f46e5;
            --primary-hover: #4338ca;
            --text-main: #0f172a;
            --text-muted: #64748b;
            --border: #e2e8f0;
            --bg-gradient: linear-gradient(135deg, #f0f9ff 0%, #e0e7ff 100%);
            --success-bg: #dcfce7;
            --success-text: #166534;
        }

        body {
            font-family: 'Inter', sans-serif;
            background: var(--bg-gradient);
            min-height: 100vh;
            margin: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
            box-sizing: border-box;
        }

        .container {
            background: #ffffff;
            max-width: 650px;
            width: 100%;
            padding: 40px;
            border-radius: 16px;
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.1), 0 8px 10px -6px rgba(0, 0, 0, 0.1);
        }

        .header {
            text-align: center;
            margin-bottom: 30px;
        }

        .header h2 {
            margin: 0;
            color: var(--text-main);
            font-size: 26px;
            font-weight: 700;
            letter-spacing: -0.5px;
        }

        .header p {
            color: var(--text-muted);
            margin-top: 8px;
            font-size: 15px;
        }

        /* 2-Column Grid Layout */
        .form-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
        }

        .form-group {
            display: flex;
            flex-direction: column;
        }

        /* Make the submit button span both columns */
        .full-width {
            grid-column: 1 / -1;
        }

        label {
            font-size: 14px;
            font-weight: 600;
            color: var(--text-main);
            margin-bottom: 8px;
        }

        input, select {
            padding: 12px 16px;
            font-size: 15px;
            border: 1px solid var(--border);
            border-radius: 8px;
            background-color: #f8fafc;
            color: var(--text-main);
            transition: all 0.2s ease;
            font-family: inherit;
        }

        input:focus, select:focus {
            outline: none;
            border-color: var(--primary);
            background-color: #ffffff;
            box-shadow: 0 0 0 3px rgba(79, 70, 229, 0.15);
        }

        input::placeholder {
            color: #94a3b8;
        }

        button {
            background-color: var(--primary);
            color: white;
            font-weight: 600;
            font-size: 16px;
            padding: 14px;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            transition: background-color 0.2s ease, transform 0.1s ease;
            margin-top: 10px;
        }

        button:hover {
            background-color: var(--primary-hover);
        }

        button:active {
            transform: scale(0.98);
        }

        .result {
            margin-top: 25px;
            padding: 16px;
            background-color: var(--success-bg);
            color: var(--success-text);
            border-radius: 8px;
            text-align: center;
            font-weight: 600;
            font-size: 16px;
            border: 1px solid #bbf7d0;
            animation: fadeIn 0.4s ease-out;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(-10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* Responsive: Stack columns on mobile */
        @media (max-width: 600px) {
            .form-grid {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body>

<div class="container">
    <div class="header">
        <h2>Student Success Predictor</h2>
        <p>Enter the student's metrics below to generate a prediction.</p>
    </div>
    
    <form action="/predict" method="POST" class="form-grid">
        
        <div class="form-group">
            <label for="gender">Gender</label>
            <select name="gender" id="gender" required>
                <option value="" disabled selected>Select gender...</option>
                <option value="Female">Female</option>
                <option value="Male">Male</option>
            </select>
        </div>

        <div class="form-group">
            <label for="age">Age</label>
            <input type="number" step="any" name="age" id="age" placeholder="e.g., 18" required>
        </div>

        <div class="form-group">
            <label for="study_hours_per_week">Study Hours (Weekly)</label>
            <input type="number" step="any" name="study_hours_per_week" id="study_hours_per_week" placeholder="e.g., 15" required>
        </div>

        <div class="form-group">
            <label for="attendance_rate">Attendance Rate (%)</label>
            <input type="number" step="any" name="attendance_rate" id="attendance_rate" placeholder="0 - 100" min="0" max="100" required>
        </div>

        <div class="form-group">
            <label for="parent_education">Parent Education Level</label>
            <select name="parent_education" id="parent_education" required>
                <option value="" disabled selected>Select level...</option>
                <option value="High School">High School</option>
                <option value="Some College">Some College</option>
                <option value="Bachelors">Bachelor's Degree</option>
                <option value="Masters">Master's Degree</option>
                <option value="PhD">PhD</option>
            </select>
        </div>

        <div class="form-group">
            <label for="internet_access">Internet Access</label>
            <select name="internet_access" id="internet_access" required>
                <option value="" disabled selected>Select...</option>
                <option value="Yes">Yes</option>
                <option value="No">No</option>
            </select>
        </div>

        <div class="form-group">
            <label for="extracurricular">Extracurricular Activities</label>
            <select name="extracurricular" id="extracurricular" required>
                <option value="" disabled selected>Select...</option>
                <option value="Yes">Yes</option>
                <option value="No">No</option>
            </select>
        </div>

        <div class="form-group">
            <label for="previous_score">Previous Score</label>
            <input type="number" step="any" name="previous_score" id="previous_score" placeholder="e.g., 85" required>
        </div>

        <div class="form-group full-width">
            <label for="final_score">Final Score</label>
            <input type="number" step="any" name="final_score" id="final_score" placeholder="e.g., 90" required>
        </div>

        <button type="submit" class="full-width">Generate Prediction</button>
    </form>

    <!-- Displays the prediction returned by Flask -->
    {% if prediction_text %}
    <div class="result">
        {{ prediction_text }}
    </div>
    {% endif %}
</div>

</body>
</html>
